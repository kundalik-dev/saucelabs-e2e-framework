name: Playwright Tests

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting
        run: pnpm run format:check

  test:
    name: Playwright Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright.config.js only enables the chromium project (firefox/webkit
      # are commented out), so only install the chromium binary in CI.
      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.js reads HEADLESS from the environment (defaulting
      # to headless: true when unset) — set it explicitly here so CI never
      # depends on that default silently staying true.
      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          CI: true
          HEADLESS: true

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      # ubuntu-latest ships a JDK, which the Allure CLI (allure-commandline,
      # installed as a devDependency) needs to generate the HTML report from
      # allure-results/.
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: pnpm run report:allure:generate

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
